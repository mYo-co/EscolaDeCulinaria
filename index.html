<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d2e">
<meta name="description" content="200+ Receitas de Arroz — mYo Escola de Culinária.">
<title>200+ Receitas de Arroz | mYo Escola de Culinária</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;background:#f7f1e4;color:#102d23;font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
a{text-decoration:none}
.hero{position:relative;width:100%;height:100svh;min-height:620px;overflow:hidden;background:#0b3d2e}
.hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.hero-cta{position:absolute;left:10%;right:10%;bottom:9%;height:72px;border-radius:999px;z-index:3;display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(18px,4vw,28px);font-weight:800;letter-spacing:.2px;background:rgba(8,91,62,.03);border:2px solid rgba(230,188,76,.18);text-indent:-9999px}
.after-hero{padding:22px 16px 10px;text-align:center;background:#f7f1e4}
.after-hero a,.bottom-cta a{display:inline-flex;align-items:center;justify-content:center;min-height:58px;padding:0 28px;border-radius:999px;background:#0b5d4b;color:#fff;font-weight:800;font-size:18px;box-shadow:0 8px 22px rgba(11,61,46,.18);border:2px solid #d9ad42}
.section{padding:28px 0 0;background:#f7f1e4}
.section h2{margin:0 16px 18px;text-align:center;font-family:Georgia,serif;font-size:28px;color:#123c2d}
.slider{position:relative;width:100%;overflow:hidden;background:#0b3d2e}
.slide{display:none;width:100%;aspect-ratio:4/3}
.slide.active{display:block}
.slide img{width:100%;height:100%;display:block;object-fit:cover}
.bottom-cta{padding:24px 16px 34px;text-align:center;background:#f7f1e4}
.bottom-cta p{margin:0 0 16px;color:#5d665f;font-size:15px}
@media(min-width:800px){
 .hero{height:100vh;min-height:700px}
 .hero img{object-position:center}
 .hero-cta{left:27%;right:27%;bottom:8%;height:86px}
 .after-hero{padding:28px}
 .section{max-width:1100px;margin:auto;padding-top:35px}
 .slider{border-radius:0}
}
@media(prefers-reduced-motion:reduce){
 .slide{transition:none}
}
</style>
</head>
<body>

<main>
  <section class="hero" aria-label="Oferta principal">
    <img src="images/hero.jpeg" alt="200+ Receitas de Arroz — mYo Escola de Culinária">
    <a class="hero-cta" href="https://checkout.escalepay" aria-label="Comprar o ebook por 297 MZN">Comprar agora</a>
  </section>

  <div class="after-hero">
    <a href="https://checkout.escalepay">QUERO O MEU EBOOK — 297 MZN</a>
  </div>

  <section class="section" aria-label="Receitas">
    <h2>Apresentado à escolha</h2>
    <div class="slider" id="slider">
      <div class="slide active"><img src="images/receita-1.jpeg" alt="Receita de arroz 1" loading="eager"></div><div class="slide"><img src="images/receita-2.jpeg" alt="Receita de arroz 2" loading="lazy"></div><div class="slide"><img src="images/receita-3.jpeg" alt="Receita de arroz 3" loading="lazy"></div><div class="slide"><img src="images/receita-4.jpeg" alt="Receita de arroz 4" loading="lazy"></div><div class="slide"><img src="images/receita-5.jpeg" alt="Receita de arroz 5" loading="lazy"></div><div class="slide"><img src="images/receita-6.jpeg" alt="Receita de arroz 6" loading="lazy"></div><div class="slide"><img src="images/receita-7.jpeg" alt="Receita de arroz 7" loading="lazy"></div><div class="slide"><img src="images/receita-8.jpeg" alt="Receita de arroz 8" loading="lazy"></div>
    </div>
  </section>

  <div class="bottom-cta">
    <p>200+ receitas para variar as suas refeições.</p>
    <a href="https://checkout.escalepay">QUERO O MEU EBOOK — 297 MZN</a>
  </div>
</main>

<script>
(() => {
  const slides = [...document.querySelectorAll('.slide')];
  let current = 0;
  setInterval(() => {
    slides[current].classList.remove('active');
    current = (current + 1) % slides.length;
    slides[current].classList.add('active');
  }, 3200);
})();
</script>
</body>
</html>
